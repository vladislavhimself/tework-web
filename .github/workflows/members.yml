# Число участников Telegram-группы @TeWorkAgency → members.json (читает первый экран и «Сегодня мы»)
name: members
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [gh-pages]
permissions:
  contents: write
concurrency: members
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch count
        run: |
          html=$(curl -sL -A "Mozilla/5.0" https://t.me/TeWorkAgency)
          n=$(echo "$html" | grep -oE 'tgme_page_extra">[^<]*' | grep -oE '[0-9][0-9 ]{2,} (members|subscribers)' | head -1 | tr -d -c '0-9')
          if [ -n "$n" ] && [ "$n" -gt 100 ]; then
            printf '{"members": %s, "updated": "%s"}\n' "$n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > members.json
            echo "members=$n"
          else
            echo "count not found, keep old file"; exit 0
          fi
      - name: Commit
        run: |
          git config user.name tework-bot
          git config user.email bot@users.noreply.github.com
          git add members.json
          git diff --cached --quiet && exit 0
          git commit -m "members: $(date -u +%Y-%m-%d)"
          git push
